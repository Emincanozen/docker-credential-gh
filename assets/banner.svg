<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">docker-credential-gh</title>
  <desc id="d">Docker asks the helper, the helper asks gh, gh returns the token for ghcr.io.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2742"/>
      <stop offset="1" stop-color="#1b4b82"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="70" y="128" font-size="58" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">docker-credential-gh</text>
    <text x="72" y="178" font-size="26" fill="#cfe3ff">ghcr.io logins for Docker, straight from your GitHub CLI session.</text>
    <text x="72" y="214" font-size="20" fill="#9fc2ee">No personal access token to create. No second copy of a secret.</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    <rect x="70" y="250" width="200" height="52" rx="10" fill="#ffffff"/>
    <text x="170" y="283" fill="#0f2742">docker</text>
    <rect x="500" y="250" width="200" height="52" rx="10" fill="#ffffff"/>
    <text x="600" y="283" fill="#0f2742">helper</text>
    <rect x="930" y="250" width="200" height="52" rx="10" fill="#ffffff"/>
    <text x="1030" y="283" fill="#0f2742">gh</text>
  </g>
  <g stroke="#cfe3ff" stroke-width="3" fill="#cfe3ff">
    <line x1="276" y1="276" x2="486" y2="276"/>
    <polygon points="494,276 482,269 482,283" stroke="none"/>
    <line x1="706" y1="276" x2="916" y2="276"/>
    <polygon points="924,276 912,269 912,283" stroke="none"/>
  </g>
</svg>
